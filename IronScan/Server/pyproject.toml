[project]
name = "ironscan-debug-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
ironscan-debug-server = "Server.app.cli:main"
ironscan-seed = "Server.app.seed:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["Server", "Server.app*", "Server.migrations*"]
exclude = ["Server.tests*"]

[tool.setuptools.package-data]
"Server.app" = ["templates/*.html", "static/*"]
Server = ["migrations/alembic.ini", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]
