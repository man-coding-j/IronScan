[project]
name = "ironscan-fixtures"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = [".model-generation", ".build"]

[tool.pytest.ini_options]
testpaths = ["IronScanTests/ML/Python"]
