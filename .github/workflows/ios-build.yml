name: iOS Build
on: [pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec Apps/IronScan/project.yml --project Apps/IronScan
      - run: xcodebuild -workspace IronScan.xcworkspace -scheme IronScan -destination 'generic/platform=iOS Simulator' build
