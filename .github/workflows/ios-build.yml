name: iOS Build
on: [pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: IronScan
    steps:
      - uses: actions/checkout@v4
      - name: Validate maintained Xcode references
        run: python3 scripts/check_repository_layout.py
      - name: Build the checked-in submission project
        run: xcodebuild -project Apps/IronScan/IronScan.xcodeproj -scheme IronScan -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
