name: iOS Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: |
          xcodebuild -version
          ls /Applications | grep -i Xcode

      - name: Select Latest Xcode Available
        run: |
          # Find all Xcode apps, sort them (which puts the highest version at the end), and grab the last one
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "No Xcode installation found!" >&2
            exit 1
          fi
          echo "Selecting latest Xcode found: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Create Dummy GoogleService-Info.plist for CI
        run: |
          mkdir -p Apps/IronScan/IronScan/App
          cat > Apps/IronScan/IronScan/App/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>API_KEY</key>
          <string>dummy_api_key_for_ci</string>
          <key>GCM_SENDER_ID</key>
          <string>dummy_sender_id</string>
          <key>PLIST_VERSION</key>
          <string>1</string>
          <key>BUNDLE_ID</key>
          <string>com.namanjain.IronScan</string>
          <key>PROJECT_ID</key>
          <string>dummy-project-id</string>
          <key>STORAGE_BUCKET</key>
          <string>dummy-bucket.appspot.com</string>
          <key>IS_ADS_ENABLED</key>
          <false/>
          <key>IS_ANALYTICS_ENABLED</key>
          <false/>
          <key>IS_APPINVITE_ENABLED</key>
          <true/>
          <key>IS_GCM_ENABLED</key>
          <true/>
          <key>IS_SIGNIN_ENABLED</key>
          <true/>
          <key>GOOGLE_APP_ID</key>
          <string>1:dummy:ios:dummy</string>
          </dict>
          </plist>
          EOF
          echo "Created dummy GoogleService-Info.plist at Apps/IronScan/IronScan/App/"

      - name: Run iOS Tests (Dynamic Simulator)
        run: |
          set -o pipefail
          
          # 1. Ensure the iOS platform runtime is actually installed on the runner
          xcodebuild -downloadPlatform iOS || true
          
          # 2. Find the UUID of the first available iPhone simulator
          SIM_ID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          
          if [ -z "$SIM_ID" ]; then
            echo "Error: No available iPhone simulators found on this runner!" >&2
            xcrun simctl list devices
            exit 1
          fi
          
          echo "Using dynamic simulator destination ID: $SIM_ID"
          
          # 3. Run the tests targeting this exact simulator ID
          xcodebuild test \
          -project Apps/IronScan/IronScan.xcodeproj \
          -scheme IronScan \
          -sdk iphonesimulator \
          -destination "id=$SIM_ID" \
          CODE_SIGNING_ALLOWED='NO' \
          | xcbeautify
