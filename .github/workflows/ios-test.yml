name: iOS Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: |
          xcodebuild -version
          ls /Applications | grep -i Xcode

      - name: Select Latest Xcode Available
        run: |
          # Find all Xcode apps, sort them (which puts the highest version at the end), and grab the last one
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "No Xcode installation found!" >&2
            exit 1
          fi
          echo "Selecting latest Xcode found: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Create Dummy GoogleService-Info.plist for CI
        run: |
          mkdir -p Apps/IronScan/IronScan/App
          cat > Apps/IronScan/IronScan/App/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>API_KEY</key>
          <string>dummy_api_key_for_ci</string>
          <key>GCM_SENDER_ID</key>
          <string>dummy_sender_id</string>
          <key>PLIST_VERSION</key>
          <string>1</string>
          <key>BUNDLE_ID</key>
          <string>com.namanjain.IronScan</string>
          <key>PROJECT_ID</key>
          <string>dummy-project-id</string>
          <key>STORAGE_BUCKET</key>
          <string>dummy-bucket.appspot.com</string>
          <key>IS_ADS_ENABLED</key>
          <false/>
          <key>IS_ANALYTICS_ENABLED</key>
          <false/>
          <key>IS_APPINVITE_ENABLED</key>
          <true/>
          <key>IS_GCM_ENABLED</key>
          <true/>
          <key>IS_SIGNIN_ENABLED</key>
          <true/>
          <key>GOOGLE_APP_ID</key>
          <string>1:dummy:ios:dummy</string>
          </dict>
          </plist>
          EOF
          echo "Created dummy GoogleService-Info.plist at Apps/IronScan/IronScan/App/"

      - name: Run iOS Tests (Absolute Path Diagnostic Mode)
        run: |
          set -o pipefail
          set -x
          
          # 1. Clean existing simulator states
          xcrun simctl shutdown all || true
          
          # 2. Strict ID extraction for Runtime and Device Type
          RUNTIME=$(xcrun simctl list runtimes | grep -Eo 'com.apple.CoreSimulator.SimRuntime.iOS[-0-9.]+' | head -n1)
          DEVICE_TYPE=$(xcrun simctl list devicetypes | awk -F '[()]' '/iPhone 14/{print $2; exit}')
          
          if [ -z "$RUNTIME" ] || [ -z "$DEVICE_TYPE" ]; then
            echo "Error: Missing strict Runtime or Device Type identifier" >&2
            xcrun simctl list runtimes
            xcrun simctl list devicetypes
            exit 1
          fi
          
          # 3. Use Absolute Paths to prevent simctl spawn write failures
          WORKDIR="$PWD"
          RESULT_BUNDLE="$WORKDIR/build/TestResults.xcresult"
          DERIVED_DATA="$WORKDIR/build/DerivedData"
          LOG_DIR="$WORKDIR/build/Logs"
          mkdir -p "$LOG_DIR" "$DERIVED_DATA"
          
          # 4. Create uniquely named simulator
          SIM_NAME="ci-iPhone-14-$(date +%s)"
          SIM_ID=$(xcrun simctl create "$SIM_NAME" "$DEVICE_TYPE" "$RUNTIME" 2>/dev/null || true)
          
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | head -n1 | grep -oE '[0-9A-F-]{36}' || true)
          fi
          
          if [ -z "$SIM_ID" ]; then
            echo "Failed to locate or create simulator" >&2
            exit 1
          fi
          
          # 5. Erase & Boot
          xcrun simctl erase "$SIM_ID" || true
          xcrun simctl boot "$SIM_ID" || true
          
          # Wait for boot (Polling to avoid bootstatus flag bugs)
          MAX_WAIT=120
          elapsed=0
          while [ $elapsed -lt $MAX_WAIT ]; do
            if xcrun simctl list devices | grep -i "$SIM_ID" | grep -qi "Booted"; then break; fi
            sleep 2; elapsed=$((elapsed + 2))
          done
          sleep 5
          
          # 6. Execute xcodebuild with absolute paths, derived data isolation, and signing overrides
          xcodebuild test \
            -project Apps/IronScan/IronScan.xcodeproj \
            -scheme IronScan \
            -sdk iphonesimulator \
            -destination "id=$SIM_ID" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED='NO' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED='NO' \
          | xcbeautify || {
            echo "Test crashed! Pulling logs with absolute paths..."
            
            SIM_CRASH_LOG="$LOG_DIR/sim_crash_log.txt"
            SIM_LOG_ARCHIVE="$LOG_DIR/sim_log_collected.logarchive"
            CRASH_DIR="$LOG_DIR/CrashReports"
            mkdir -p "$CRASH_DIR"
            
            xcrun simctl spawn "$SIM_ID" log show --style compact --last 10m > "$SIM_CRASH_LOG" || true
            xcrun simctl spawn "$SIM_ID" log collect --output "$SIM_LOG_ARCHIVE" || true
            cp -R "$HOME/Library/Logs/DiagnosticReports/"* "$CRASH_DIR" 2>/dev/null || true
            
            echo "==== Crash Report Head ===="
            if ls "$CRASH_DIR"/IronScan*.ips >/dev/null 2>&1; then
              head -n 200 "$CRASH_DIR"/IronScan*.ips || true
            else
              echo "No .ips crash report found in $CRASH_DIR"
            fi
            
            exit 65
          }

      - name: Upload Test Results Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ${{ github.workspace }}/build/
