name: iOS Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: |
          xcodebuild -version
          ls /Applications | grep -i Xcode

      - name: Select Latest Xcode Available
        run: |
          # Find all Xcode apps, sort them (which puts the highest version at the end), and grab the last one
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "No Xcode installation found!" >&2
            exit 1
          fi
          echo "Selecting latest Xcode found: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Run iOS Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Apps/IronScan/IronScan.xcodeproj \
            -scheme IronScan \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED='NO' \
          | xcbeautify
